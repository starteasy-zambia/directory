html{overflow-x:hidden !important;width:100%;-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--light);margin:0; padding-bottom: 70px;}
#root{overflow-x:hidden;width:100%}
*,*::before,*::after{box-sizing:border-box;min-width:0}
h1,h2,h3,h4,h5,h6,p,span,a,li,div,button{overflow-wrap:break-word}

.serif{font-family:'Playfair Display',Georgia,serif}
.micro{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
::selection{background:var(--orange-2);color:var(--forest)}

.fadein{animation:fi .35s ease both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.mc{animation:mc .3s cubic-bezier(.22,.61,.36,1) both}
@keyframes mc{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
.mf{animation:mf .2s ease both}
@keyframes mf{from{opacity:0}to{opacity:1}}

.dash-layout{display:grid;grid-template-columns:238px 1fr;gap:1.6rem;align-items:start;padding:2rem 0 3.4rem;max-width:1240px;margin:0 auto;}
.dash-side{position:sticky;top:86px;background:#fff;border:1px solid rgba(10,31,18,.08);border-radius:14px;padding:.7rem;display:grid;gap:.15rem}

.dash-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.4rem;flex-wrap:wrap}

.empty{text-align:center;padding:3.4rem 1.5rem;background:#fff;border:1px dashed rgba(10,31,18,.15);border-radius:14px}

.el .eh .sub{font-size:9.5px;color:#8A6828;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-top:4px}
.el .eh .dt{font-family:'Playfair Display',Georgia,serif;font-size:14px;font-weight:800;color:#E8730F;letter-spacing:1.2px;text-align:right}
.el .eh .mt{font-size:11px;color:#666;text-align:right;margin-top:6px}
.el h4{font-family:'Playfair Display',Georgia,serif;font-size:15px;color:#0A1F12;font-weight:700;margin:22px 0 10px}
.el h4:first-of-type{margin-top:0}
.el p{margin:0 0 12px}
.el ul{margin:0 0 14px;padding-left:22px}
.el li{margin-bottom:6px;font-size:12.5px}
.el .total{margin-top:8px;padding-top:14px;border-top:2px solid #0A1F12;display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.el .total .tl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#8A6828}
.el .total .tv{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:800;color:#E8730F}
.el .sign{margin-top:26px;padding-top:20px;border-top:1px solid #E0E0E0;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.el .sign .sigval{font-family:'Playfair Display',Georgia,serif;font-size:16px;font-weight:700;color:#0A1F12;letter-spacing:.04em;font-style:italic;padding-bottom:8px;border-bottom:1px solid #333;margin-bottom:10px;min-height:38px}
.el .sign .lbl{font-size:10.5px;color:#666;font-weight:600}
.el .ft{margin-top:22px;padding-top:16px;border-top:2px solid #0A1F12;font-size:10.5px;color:#666;line-height:1.6}
.paygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.pmc{background:#fff;border:2px solid rgba(10,31,18,.12);border-radius:12px;padding:16px 12px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;transition:all .22s}

.pmc .nm{font-size:12.5px;font-weight:800;color:#0A1F12}
.pmc .ds{font-size:10.5px;color:rgba(10,31,18,.5);line-height:1.35}
.pm-airtel .lg{background:#E40000;color:#fff;font-style:italic;text-transform:lowercase;font-size:14px}
.pm-mtn .lg{background:#FFCC00;color:#000;font-size:13px}

.tl{list-style:none;padding:0;margin:0}

/* Spotlight Feed Styles */
.spotlight-card { background:#fff; border:1px solid rgba(10,31,18,.08); border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(10,31,18,.04); }

.spotlight-body { font-size:14.5px; line-height:1.65; color:rgba(10,31,18,.85); white-space:pre-wrap; margin-bottom:12px; }
.spotlight-media { width:100%; max-height:400px; object-fit:cover; border-radius:8px; margin-bottom:12px; border:1px solid rgba(10,31,18,.05); }
.spotlight-footer { border-top:1px solid rgba(10,31,18,.08); padding-top:8px; margin-top:8px; display:flex; justify-content:space-between; }
.sa-btn { display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; border-radius:6px; font-size:13px; font-weight:700; color:rgba(10,31,18,.6); background:transparent; border:none; cursor:pointer; transition:all .2s; flex:1; }
.sa-btn:hover { background:rgba(10,31,18,.04); color:#0A1F12; }
.comment-box { background:#F8FAF6; border-radius:8px; padding:12px; margin-top:10px; display:flex; gap:10px; }
.comment-input { flex:1; border:1px solid rgba(10,31,18,.15); border-radius:20px; padding:8px 16px; font-size:13px; outline:none; }
.comment-input:focus { border-color:#E8730F; }
.comments-list { margin-top:12px; display:flex; flex-direction:column; gap:10px; }
.comment-item { display:flex; gap:10px; align-items:flex-start; }
.comment-avatar { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0; overflow:hidden; }
.comment-content { background:#F8FAF6; padding:8px 12px; border-radius:0 12px 12px 12px; flex:1; }
.comment-author { font-size:12px; font-weight:800; color:#0A1F12; margin-bottom:2px; }
.comment-text { font-size:13px; color:rgba(10,31,18,.75); line-height:1.4; }

/* Mobile Bottom Navigation Bar */
.mobile-bottom-nav {
  display: none;
}
@media (max-width: 768px) {
  .mobile-bottom-nav {
    display: flex;
    position: fixed;
    bottom: 0;
    left: 0;

    justify-content: space-around;

  .mobile-bottom-nav button {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: none;

    width: 20%;
    padding: 4px 0;
  }

    font-size: 20px;

  }
}

@media (max-width:1040px){
  .dash-layout{display: flex;flex-direction: column;padding: 0;gap: 0;max-width: 100vw;}
  .dash-side{position: sticky;top: 72px;z-index: 40;display: flex;flex-direction: row;overflow-x: auto;background: #fff;padding: 12px 16px;border-bottom: 1px solid rgba(10,31,18,.08);border-radius: 0;margin: 0;width: 100%;white-space: nowrap;-webkit-overflow-scrolling: touch;scrollbar-width: none;gap: 8px;}
  .dash-side::-webkit-scrollbar { display: none; }
  .dash-side .side-label{display: none;}
  .dash-side a{display: inline-flex;align-items: center;gap: 8px;padding: 8px 16px;border-radius: 999px;font-size: 13px;font-weight: 700;flex-shrink: 0;background: rgba(10,31,18,.04);color: rgba(10,31,18,.7);transition: all .2s;}
  .dash-side a.active {background: #E8730F;color: #fff;}

@media (max-width:640px){
  .stat-grid{grid-template-columns:1fr 1fr;}
  .dash-head h1 { font-size: 1.4rem; }
  .hide-sm{display:none!important;}
}
</style>

function authErrorMessage(e){
  const code=(e&&e.code)||'';
  if(code==='auth/email-already-in-use') return 'This email is already registered. Try signing in.';

async function uploadImage(file, path) {
  if(!firebaseReady || !storage) throw new Error("Firebase not ready");
  const fileRef = storage.ref(`${path}/${Date.now()}_${file.name}`);
  await fileRef.put(file);
  return await fileRef.getDownloadURL();
}

async function authSignUp(form){
  if(!firebaseReady) throw new Error('Firebase not ready');
  let cred=null;
  try{
    cred=await auth.createUserWithEmailAndPassword(form.email,form.password);
    
    // Upload images if provided
    let profilePhotoUrl = '';
    let coverPhotoUrl = '';
    
    if (form.profileFile) {
      profilePhotoUrl = await uploadImage(form.profileFile, 'profiles');
    }
    if (form.role === 'supplier' && form.coverFile) {
      coverPhotoUrl = await uploadImage(form.coverFile, 'covers');
    }

    const profile={
      name:form.name,businessName:form.businessName,phone:form.phone,email:form.email,
      role:form.role,category:form.category,location:form.location,
      country:form.country||'Zambia',scope:form.scope||'local',
      status:'pending',createdAt:Date.now(),
      profilePhoto: profilePhotoUrl,
      coverPhoto: coverPhotoUrl
    };
    if(form.role==='supplier'){
      profile.products=splitCSV(form.products);
      profile.moq=form.moq||'Contact supplier';
      profile.delivery=form.delivery||'Contact supplier';
      profile.leadTime=form.leadTime||'Contact supplier';
      profile.website=form.website||'';
      profile.photos=form.photos||'';
    }
    if(form.role==='buyer'){
      profile.sources=splitCSV(form.sources);
      profile.frequency=form.frequency||'Monthly';
      profile.orderValue=form.orderValue||'Contact buyer';
    }
    await db.collection('se_users').doc(cred.user.uid).set(profile);
    return { email: form.email };
  } finally {
    try { await auth.signOut(); } catch(_){}
  }
}

function isInternationalEntity(e){
  if(!e) return false;
  if(e.scope==='international'||e.scope==='both') return true;
  if(e.country && e.country!=='Zambia') return true;
  return false;
}
function locLabel(e){
  if(!e) return '';
  const parts=[e.location];
  if(e.country && e.country!=='Zambia' && e.country!==e.location) parts.push(e.country);
  return parts.filter(Boolean).join(', ');
}

function BrandLogo({ size = 38, showDirectoryLabel = false }){
  const [imgError, setImgError] = useState(false);

  if (!imgError) {
    return <img
      src="Logo2.png"
      alt="StartEasy"
      onError={() => setImgError(true)}
      style={{ height: size, maxWidth: size * 5, width: 'auto', objectFit: 'contain', flexShrink: 0, display: 'block' }}
    />;
  }

  return (
    <span style={{ display:'inline-flex', alignItems:'center', gap:10 }}>
      <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:size,height:size,borderRadius:'50%',background:'#fff',boxShadow:'0 4px 12px -4px rgba(10,31,18,.5)',flexShrink:0}}>
        <span className="serif" style={{fontSize:size*0.5,fontWeight:800,color:'#0A1F12',lineHeight:1}}>S<span style={{color:'#E8730F'}}>E</span></span>

}

function Modal({open,onClose,eyebrow,title,children,maxWidth='46rem'}){
  useEffect(()=>{
    if(open){document.body.style.overflow='hidden';}else{document.body.style.overflow='';}
    return ()=>{document.body.style.overflow='';};
  },[open]);
  useEffect(()=>{
    const onKey=e=>{if(e.key==='Escape')onClose();};
    if(open)window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[open,onClose]);
  if(!open) return null;
  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-[2000] flex items-center justify-center p-3 mf"
      style={{background:'rgba(10,31,18,0.85)',position:'fixed',inset:0,zIndex:2000,display:'flex',alignItems:'center',justifyContent:'center',padding:'12px'}}
      onClick={onClose}>
      <div className="mc" onClick={e=>e.stopPropagation()}
        style={{background:'#F5FAF6',borderRadius:12,width:'100%',maxWidth:maxWidth,maxHeight:'92vh',overflowY:'auto',boxShadow:'0 30px 80px rgba(0,0,0,.35)'}}>
        <div style={{background:'#0A1F12',padding:'16px 24px',display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:10,borderBottom:'1px solid rgba(245,166,35,.15)'}}>
          <div style={{display:'flex',alignItems:'center',gap:12,minWidth:0}}>
            <span style={{width:8,height:8,borderRadius:'50%',background:'#F5A623'}}></span>
            <span style={{fontSize:10.5,letterSpacing:'.2em',textTransform:'uppercase',fontWeight:700,color:'#F5A623'}}>{eyebrow||'StartEasy'}</span>
          </div>
          <button onClick={onClose} style={{background:'none',border:'none',color:'rgba(255,255,255,.6)',cursor:'pointer',padding:6,fontSize:16}} aria-label="Close"><i className="fas fa-times"></i></button>
        </div>
        <div style={{padding:'24px 28px', paddingBottom: '80px'}}>{children}</div>
      </div>
    </div>,
    document.body
  );
}
const INP_STYLE = {width:'100%',background:'#fff',border:'1.5px solid rgba(10,31,18,.15)',borderRadius:9,padding:'12px 14px',fontSize:13.5,color:'#0A1F12',fontFamily:'inherit'};
function TIn({value,onChange,placeholder,type='text'}){
  return <input type={type} value={value||''} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={INP_STYLE}/>;
}
function PasswordInput({value,onChange,placeholder='••••••••',autoComplete='current-password'}){
  const [show,setShow]=useState(false);
  return <div style={{position:'relative'}}>
    <input type={show?'text':'password'} value={value||''} onChange={e=>onChange(e.target.value)} placeholder={placeholder} autoComplete={autoComplete} style={{...INP_STYLE,paddingRight:46}}/>
    <button type="button" onClick={()=>setShow(!show)} aria-label={show?'Hide password':'Show password'} title={show?'Hide password':'Show password'}
      style={{position:'absolute',right:6,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',padding:8,cursor:'pointer',color:'rgba(10,31,18,.5)',fontSize:15,lineHeight:1,display:'flex',alignItems:'center',justifyContent:'center',borderRadius:6,transition:'color .15s'}}
      onMouseEnter={e=>{e.currentTarget.style.color='#E8730F';}}
      onMouseLeave={e=>{e.currentTarget.style.color='rgba(10,31,18,.5)';}}>
      <i className={`fas ${show?'fa-eye-slash':'fa-eye'}`}></i>
    </button>
  </div>;
}

function ImageUploader({ label, currentUrl, onFileSelect, aspectRatio = '1/1' }) {
  const [preview, setPreview] = useState(currentUrl || '');

  useEffect(() => { setPreview(currentUrl || ''); }, [currentUrl]);

  const handleFileChange = (e) => {
    const file = e.target.files[0];
    if (file) {
      if (file.size > 5 * 1024 * 1024) {
        toast('Image is too large. Max 5MB.', 'error');
        return;
      }
      const objUrl = URL.createObjectURL(file);
      setPreview(objUrl);
      onFileSelect(file);
    }
  };

  return (
    <div>
      <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>{label}</label>
      <div style={{display:'flex', alignItems:'center', gap: 12}}>
        <div style={{
          width: aspectRatio === '3/1' ? 120 : 64,
          height: aspectRatio === '3/1' ? 40 : 64,
          borderRadius: aspectRatio === '3/1' ? 8 : '50%',
          background: '#E5E7EB',
          backgroundImage: preview ? `url(${preview})` : 'none',
          backgroundSize: 'cover',
          backgroundPosition: 'center',
          border: '2px solid #D1D5DB',
          flexShrink: 0,
          display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#9CA3AF',
          overflow: 'hidden'
        }}>
          {!preview && <i className="fas fa-camera" style={{fontSize: aspectRatio === '3/1' ? 16 : 20}}></i>}
        </div>
        <div style={{flex: 1}}>
          <input type="file" accept="image/*" onChange={handleFileChange} style={{display:'block', width:'100%', padding:'8px', background:'#fff', border:'1px dashed rgba(10,31,18,.3)', borderRadius:'6px', fontSize:'12px'}} />
        </div>
      </div>
    </div>
  );
}

function Nav({user,profile,onSignIn,onSignUp,onDashboard,onBrowse,onSpotlights,onSignOut}){

    const handleClickOutside = (e)=>{
      if(acctRef.current && !acctRef.current.contains(e.target)) setAcctOpen(false);
      if(menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false);

    document.addEventListener('mousedown', handleClickOutside);

          <a href="#" onClick={(e)=>{e.preventDefault(); user ? onDashboard() : onSignIn();}} style={{display:'flex',alignItems:'center',gap:10,textDecoration:'none',flexShrink:0}}>

            <span>Back to Platform</span>

          {user && (
            <div className="acct" ref={acctRef}>
              <button className="acct-btn" onClick={()=>setAcctOpen(!acctOpen)} style={{background:'rgba(255,255,255,.08)',borderColor:'rgba(255,255,255,.2)',color:'#fff'}}>
                <span className="avatar" style={{background:'#E8730F',color:'#fff'}}>
                  {profile?.profilePhoto ? <img src={profile.profilePhoto} alt="User" /> : initials(profile?.name || user.email)}
                </span>
                <span className="acct-name">{(profile?.name || user.email).split(' ')[0]}</span>
                <i className={`fas fa-chevron-down`} style={{fontSize:10, marginLeft:4, color:'rgba(255,255,255,.5)'}}></i>
              </button>
              <div className={`acct-menu ${acctOpen?'open':''}`}>
                <div style={{padding:'.55rem .7rem .3rem'}}>
                  <div style={{fontWeight:800,fontSize:'.86rem',color:'#0A1F12', display:'flex', alignItems:'center', gap:6}}>

                {profile?.role==='supplier' && <>

                position:'absolute', right:0, top:'calc(100% + 12px)', 
                width:280, 
                maxHeight:'calc(100vh - 160px)', 
                overflowY:'auto', 
                background:'#08170D', border:'1px solid rgba(245,166,35,.2)', borderRadius:14, padding:10, display:'flex', flexDirection:'column', gap:6, boxShadow:'0 20px 40px -10px rgba(0,0,0,.6)', zIndex:100

function SpotlightCard({ post, user, onComment }) {
  const [showComments, setShowComments] = useState(false);
  const [commentText, setCommentText] = useState('');
  const [sending, setSending] = useState(false);
  const [copied, setCopied] = useState(false);

  const handleComment = async (e) => {
    e.preventDefault();
    if (!commentText.trim() || !user) return;
    setSending(true);
    await onComment(post.id, commentText);
    setCommentText('');
    setSending(false);
  };

  const handleShare = () => {
    const text = `*Business Spotlight from ${post.businessName}*\n\n${post.title ? post.title + '\n' : ''}${post.content}\n\nView more on StartEasy Zambia: https://directory.starteasyzambia.com/#spotlights`;
    window.open(waUrl(text), '_blank');
  };

  const copyLink = () => {
    navigator.clipboard.writeText(`https://directory.starteasyzambia.com/#spotlights`);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  return (
    <div className="spotlight-card">
      <div className="spotlight-header">
        <div className="spotlight-avatar" style={{ background: 'rgba(232,115,15,.1)', color: '#E8730F' }}>
          {post.profilePhoto ? <img src={post.profilePhoto} alt="Profile" style={{width:'100%', height:'100%', objectFit:'cover'}} /> : initials(post.businessName)}
        </div>
        <div style={{flex:1, minWidth:0}}>
          <div style={{display:'flex', alignItems:'center', gap:2}}>
            <span style={{fontSize:15, fontWeight:800, color:'#0A1F12'}}>{post.businessName}</span>
            <VerifiedBadge size={16} />
          </div>
          <div style={{fontSize:12, color:'rgba(10,31,18,.5)', marginTop:2}}>
            {post.authorName} · {new Date(post.createdAt).toLocaleDateString('en-GB',{day:'numeric',month:'short', hour:'2-digit', minute:'2-digit'})}
          </div>
        </div>
      </div>
      
      {post.title && <h3 style={{fontSize:16, fontWeight:800, color:'#0A1F12', marginBottom:10}}>{post.title}</h3>}
      
      {post.mediaUrl && post.mediaType === 'image' && (
        <img src={post.mediaUrl} alt="Spotlight media" className="spotlight-media" />
      )}
      {post.mediaUrl && post.mediaType === 'video' && (
        <video src={post.mediaUrl} controls className="spotlight-media" />
      )}

      <div className="spotlight-body">{post.content}</div>

      <div className="spotlight-footer">
        <button className="sa-btn" onClick={() => setShowComments(!showComments)}>
          <i className="far fa-comment"></i> {post.comments && post.comments.length > 0 ? `${post.comments.length} Enquiries` : 'Comment'}
        </button>
        <button className="sa-btn" onClick={handleShare} title="Send via WhatsApp">
          <i className="fab fa-whatsapp"></i> Send
        </button>
        <button className="sa-btn" onClick={copyLink} title="Copy Link">
          <i className={`fas ${copied ? 'fa-check' : 'fa-link'}`}></i> {copied ? 'Copied' : 'Share'}
        </button>
      </div>

      {showComments && (
        <div className="comments-list">
          {post.comments && post.comments.map(c => (
            <div key={c.id} className="comment-item">
              <div className="comment-avatar" style={{ background: 'rgba(27,108,168,.1)', color: '#1B6CA8' }}>
                {initials(c.authorName)}
              </div>
              <div className="comment-content">
                <div className="comment-author">{c.authorName}</div>
                <div className="comment-text">{c.text}</div>
              </div>
            </div>
          ))}
          
          {user ? (
            <form onSubmit={handleComment} className="comment-box">
              <input 
                type="text" 
                className="comment-input" 
                placeholder="Ask a question or enquire about this service..." 
                value={commentText}
                onChange={e => setCommentText(e.target.value)}
              />
              <button type="submit" disabled={sending} style={{background:'#E8730F', color:'#fff', border:'none', borderRadius:'50%', width:36, height:36, display:'flex', alignItems:'center', justifyContent:'center', cursor: sending ? 'wait' : 'pointer'}}>
                <i className={`fas ${sending ? 'fa-spinner fa-spin' : 'fa-paper-plane'}`}></i>
              </button>
            </form>
          ) : (
            <p style={{fontSize:12, color:'rgba(10,31,18,.5)', textAlign:'center', padding:10}}>Sign in to leave a comment.</p>
          )}
        </div>
      )}
    </div>
  );
}

function PublicSpotlightsPage({ user, onDashboard, onPostClick }) {
  const [spotlights, setSpotlights] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!firebaseReady) {
      setLoading(false);
      return;
    }
    
    const unsub = db.collection('se_spotlights').orderBy('createdAt', 'desc').limit(50)
      .onSnapshot(snap => {
        const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        setSpotlights(data);
        setLoading(false);
      }, err => {
        console.error("Snapshot error:", err);
        setLoading(false);
      });

    return () => unsub();
  }, []);

  const addComment = async (postId, text) => {
    if (!user || !firebaseReady) return;
    try {
      const postRef = db.collection('se_spotlights').doc(postId);
      const postDoc = await postRef.get();
      if (postDoc.exists) {
        const currentComments = postDoc.data().comments || [];
        const newComment = {
          id: Date.now().toString(),
          userId: user.uid,
          authorName: user.displayName || user.email.split('@')[0],
          text: text,
          createdAt: Date.now()
        };
        await postRef.update({ comments: [...currentComments, newComment] });
      }
    } catch (e) {
      console.error("Comment error:", e);
      toast('Failed to post comment.', 'error');
    }
  };

  return <div className="fadein" style={{minHeight:'100%', background:'#F5FAF6', display:'flex', flexDirection:'column'}}>
    <main style={{flex:1, maxWidth:800, margin:'0 auto', padding:'40px 24px 60px', width:'100%'}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:32, flexWrap:'wrap', gap:16}}>
        <div>
          <span className="micro" style={{color:'#E8730F', display:'block', marginBottom:12}}>Community Highlights</span>
          <h1 className="serif" style={{fontSize:'clamp(2rem,4vw,2.8rem)', lineHeight:1.15, color:'#0A1F12', margin:'0 0 8px'}}>Business Spotlights</h1>
          <p style={{fontSize:15, color:'rgba(10,31,18,.65)', margin:0}}>Discover what verified businesses and suppliers are building.</p>
        </div>
        {user && (
          <button onClick={onPostClick} style={{padding:'12px 24px', background:'#E8730F', color:'#fff', border:'none', borderRadius:8, fontSize:14, fontWeight:700, display:'inline-flex', alignItems:'center', gap:8, boxShadow:'0 4px 12px rgba(232,115,15,.3)'}}>
            <i className="fas fa-plus"></i> Create Post
          </button>
        )}
      </div>

      {loading ? (
        <div style={{textAlign:'center', padding:'60px 0'}}><i className="fas fa-spinner fa-spin" style={{fontSize:24, color:'#E8730F'}}></i></div>
      ) : spotlights.length === 0 ? (
        <EmptyState icon="fa-newspaper" title="No spotlights yet" text="Be the first to share your business story with the community." cta={<button onClick={onDashboard} style={{padding:'10px 20px', background:'#E8730F', color:'#fff', border:'none', borderRadius:8, fontSize:13, fontWeight:700}}>Go to Dashboard</button>} />
      ) : (
        <div>
          {spotlights.map((post) => (
            <SpotlightCard key={post.id} post={post} user={user} onComment={addComment} />
          ))}
        </div>
      )}
    </main>
    <Footer/>
  </div>;
}

function CreateSpotlightModal({ onClose, onSave, profile }) {
  const [form, setForm] = useState({ title: '', content: '' });
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [submitting, setSubmitting] = useState(false);

  const handleFileChange = (e) => {
    const selected = e.target.files[0];
    if (selected) {
      if (selected.size > 5 * 1024 * 1024) {
        toast('Image is too large. Please select a file under 5MB.', 'error');
        e.target.value = null;
        return;
      }
      setFile(selected);
      setPreview(URL.createObjectURL(selected));
    }
  };

  const submit = async () => {
    if(!form.title.trim()) return toast('Enter a headline for your spotlight.', 'error');
    if(!form.content.trim()) return toast('Write something about your business.', 'error');
    
    setSubmitting(true);
    
    let mediaUrl = null;
    let mediaType = null;

    if (file && storage) {
      try {
        const fileRef = storage.ref(`spotlights/${Date.now()}_${file.name}`);
        const uploadTask = fileRef.put(file);
        await Promise.race([
          uploadTask,
          new Promise((_, reject) => setTimeout(() => reject(new Error('Upload timed out')), 10000))
        ]);
        mediaUrl = await fileRef.getDownloadURL();
        mediaType = file.type.startsWith('video') ? 'video' : 'image';
      } catch (error) {
        console.error("Upload failed or timed out", error);
        toast('Upload failed', 'error');
        mediaUrl = null;
        mediaType = null;
      }
    }

    try {
      await onSave({ ...form, mediaUrl, mediaType });
    } catch (e) {
      console.error(e);
    } finally {
      setSubmitting(false);
    }
  };

  return <Modal open={true} onClose={onClose} eyebrow="Business Spotlight" maxWidth="36rem">
    <h2 className="serif" style={{fontSize:24, marginBottom:6, color:'#0A1F12'}}>Share an Update</h2>
    <p style={{fontSize:13,color:'rgba(10,31,18,.6)',marginBottom:20}}>Post about new products, services, or business milestones. Visible to the public.</p>
    
    <div className="form-grid" style={{gap:14}}>
      <div>
        <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Headline *</label>
        <TIn value={form.title} onChange={v=>setForm({...form,title:v})} placeholder="e.g. We just launched a new fabric line!"/>
      </div>
      <div>
        <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Details *</label>
        <textarea value={form.content} onChange={e=>setForm({...form,content:e.target.value})} rows={4} placeholder="Tell the community what you're building, offering, or looking for..." style={{...INP_STYLE, resize:'vertical', fontFamily:'inherit'}}/>
      </div>
      
      <div>
        <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Attach Media (Max 5MB)</label>
        <input type="file" accept="image/*,video/*" onChange={handleFileChange} style={{display:'block', width:'100%', padding:'10px', background:'#fff', border:'1px dashed rgba(10,31,18,.3)', borderRadius:'8px', fontSize:'13px'}} />
        {preview && (
          <div style={{marginTop:12, position:'relative'}}>
            {file.type.startsWith('video') ? (
              <video src={preview} controls style={{width:'100%', borderRadius:'8px', maxHeight:'200px', objectFit:'cover'}} />
            ) : (
              <img src={preview} alt="Preview" style={{width:'100%', borderRadius:'8px', maxHeight:'200px', objectFit:'cover'}} />
            )}
            <button onClick={()=>{setFile(null);setPreview(null);}} style={{position:'absolute', top:8, right:8, background:'rgba(0,0,0,0.6)', color:'#fff', border:'none', borderRadius:'50%', width:24, height:24, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer'}}><i className="fas fa-times"></i></button>
          </div>
        )}
      </div>
    </div>

    <div style={{display:'flex', gap:10, marginTop:22, flexWrap:'wrap'}}>
      <button onClick={submit} disabled={submitting} style={{flex:'1 1 200px', padding:'14px', background:submitting?'#ccc':'linear-gradient(135deg,#E8730F,#F5A623)', color:'#fff', border:'none', borderRadius:8, fontSize:14, fontWeight:700, cursor:submitting?'wait':'pointer', display:'inline-flex', alignItems:'center', justifyContent:'center', gap:8}}>
        <i className={`fas ${submitting?'fa-spinner fa-spin':'fa-paper-plane'}`}></i>{submitting?'Posting…':'Post to Spotlight'}
      </button>
      <button onClick={onClose} style={{padding:'14px 22px', background:'#fff', border:'1px solid rgba(10,31,18,.15)', borderRadius:8, fontSize:14, fontWeight:600, color:'#0A1F12'}}>Cancel</button>
    </div>
  </Modal>;
}

      });

      ]);

      setCampaignsState(cloudCampaigns.length ? cloudCampaigns : getCampaigns(user.uid));

      saveCampaigns(user.uid, cloudCampaigns);
      
      setSavedSuppliersState(getSavedSuppliers(user.uid));

    });
  },[user]);

      .onSnapshot(snap => {
        const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        setMySpotlights(data);
      });
    return () => unsub();
  }, [user]);

  useEffect(()=>{
    if(!profile) return;
    fsLoadDirectory().then(res=>{
      const sups = (res&&res.suppliers.length)?res.suppliers:SEED_SUPPLIERS;
      const buys = (res&&res.buyers.length)?res.buyers:SEED_BUYERS;
      setAllSuppliers(sups);

      setMatches(pool.filter(x=>x.category===profile.category).slice(0,12));
    });
    if(profile.role!=='supplier'){ loadUserQuotes(user.uid).then(q=>setQuotes(q)); }
  },[profile,user]);

  useEffect(()=>{
    const onTab = (e)=> setTab(e.detail);
    window.addEventListener('nav-tab', onTab);
    return () => window.removeEventListener('nav-tab', onTab);
  },[]);

  const saveProfile=async()=>{
    if(!editForm) return;
    setSaving(true);setSaveMsg(null);

      let finalCoverPhoto = editForm.coverPhoto;

      if (coverFile) finalCoverPhoto = await uploadImage(coverFile, 'covers');

      const updates={
        name:editForm.name.trim(),
        businessName:editForm.businessName.trim(),
        phone:editForm.phone.trim(),
        category:editForm.category,
        location:editForm.location,
        country:editForm.country||'Zambia',
        scope:editForm.scope||'local', 
        profilePhoto: finalProfilePhoto, 
        coverPhoto: finalCoverPhoto
      };
      
      if(isSupplier){
        updates.products=splitCSV(editForm.products);
        updates.moq=editForm.moq;
        updates.delivery=editForm.delivery;
        updates.leadTime=editForm.leadTime;
        updates.website=editForm.website;
        updates.photos=editForm.photos;
        updates.regNo=editForm.regNo;
        updates.docsUrl=editForm.docsUrl;
        updates.refs=editForm.refs;
        updates.featured=editForm.featured;
      }
      else{
        updates.sources=splitCSV(editForm.sources);
        updates.frequency=editForm.frequency;
        updates.orderValue=editForm.orderValue;
      }
      if(firebaseReady) await db.collection('se_users').doc(user.uid).update(updates);
      
      const updatedProfile = {...profile,...updates};
      setProfile(updatedProfile);
      setEditForm(prev => ({...prev, profilePhoto: finalProfilePhoto, coverPhoto: finalCoverPhoto}));
      setProfileFile(null);
      setCoverFile(null);
      
      setSaveMsg({kind:'ok',msg:'Profile saved.'});
      toast('Profile saved successfully.', 'success');
      setTimeout(()=>setSaveMsg(null),3000);
    }catch(e){
      setSaveMsg({kind:'err',msg:'Save failed: '+(e.code||e.message)});

        clientDesc: `This is a payment for ${title}. Once paid, your feature will unlock immediately.`,
        whatsCovered: ['Access to premium feature', 'System processing', 'Support'],

/* ═══════════════════ CHECKOUT FLOW ═══════════════════ */
function CheckoutFlow({service, client, onSuccess, onCancel}) {
  const [step, setStep] = useState('review');
  
  const handlePaymentSubmit = () => {
    setStep('done');
    setTimeout(() => onSuccess(), 2500);
  };

  if (step === 'done') {
    return <div style={{textAlign:'center', padding:'40px 20px'}}>
      <i className="fas fa-circle-check" style={{fontSize:56, color:'#1E7B3C', marginBottom:16, display:'block'}}></i>
      <h2 className="serif" style={{fontSize:24, color:'#0A1F12', marginBottom:10}}>Payment Submitted</h2>
      <p style={{fontSize:14, color:'rgba(10,31,18,.7)', maxWidth:400, margin:'0 auto 24px', lineHeight:1.6}}>
        Your payment reference has been received. A StartEasy officer is verifying it manually. Your feature will unlock automatically once confirmed.
      </p>
      <button onClick={onSuccess} style={{padding:'12px 24px', background:'#0A1F12', color:'#fff', border:'none', borderRadius:8, fontSize:14, fontWeight:700}}>Continue to Feature</button>
    </div>;
  }

  if (step === 'payment') {
    return <div>
      <Payment 
        service={service} 
        client={client} 
        onClose={onCancel} 
        onDone={handlePaymentSubmit} 
      />
    </div>;
  }

  return <div>
    <div className="el printable" style={{marginBottom:24}}>
      <div className="eh">
        <div>
          <div className="brand">Start<em>Easy</em></div>
          <div className="sub">Administrative Services Desk · Zambia</div>
        </div>
        <div>
          <div className="dt">INVOICE / ENGAGEMENT</div>
          <div className="mt">{new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</div>
        </div>
      </div>
      <p><strong>Client:</strong> {client.name || client.businessName || 'Valued Client'}</p>
      <p><strong>Service:</strong> {service.title}</p>
      
      <h4>Scope of Service</h4>
      <p>{service.clientDesc}</p>
      <ul>
        {service.whatsCovered.map((item, i) => <li key={i}>{item}</li>)}
      </ul>
      
      <div className="total">
        <span className="tl">Amount Due</span>
        <span className="tv">{service.amountOverride}</span>
      </div>
      <p style={{fontSize:11.5,color:'#666',fontStyle:'italic',marginTop:8}}>All amounts are StartEasy service fees for work only. They are separate from and do not include any government or regulator fee.</p>
    </div>

    <div style={{display:'flex', gap:10, justifyContent:'flex-end'}}>
      <button onClick={onCancel} style={{padding:'12px 24px', background:'#fff', border:'1px solid rgba(10,31,18,.15)', borderRadius:8, fontSize:14, fontWeight:600, color:'#0A1F12'}}>Cancel</button>
      <button onClick={()=>setStep('payment')} style={{padding:'12px 24px', background:'linear-gradient(135deg,#E8730F,#F5A623)', color:'#fff', border:'none', borderRadius:8, fontSize:14, fontWeight:700}}>Proceed to Payment</button>
    </div>
  </div>;
}

/* ═══════════════════ PAYMENT COMPONENT (REUSED) ═══════════════════ */
function Payment({service,client,onClose,onDone}){
  const s=service;
  const amountDue=s.amountOverride || 'K100';
  const receiptPrefix='SE-'+(s.code||'DIR');
  const [method,setMethod]=useState(null);
  const [senderName,setSenderName]=useState(client.name||'');
  const [senderContact,setSenderContact]=useState(client.phone||client.email||'');
  const [userRef,setUserRef]=useState('');
  const [agree,setAgree]=useState(false);
  const [errorMsg,setErrorMsg]=useState('');
  const [confirmed,setConfirmed]=useState(false);
  const [saving,setSaving]=useState(false);
  const [cloudSaved,setCloudSaved]=useState(null);
  const [receiptNo,setReceiptNo]=useState('');
  const [whatsappUrl,setWhatsappUrl]=useState('');
  const [whatsappSent,setWhatsappSent]=useState(false);
  const [copied,setCopied]=useState('');

  const copyTxt=(t,k)=>{const done=()=>{setCopied(k);setTimeout(()=>setCopied(''),1500)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(done);else done()};

  const buildMsg=(r,dt)=>['*STARTEASY — SERVICE FEE*','','*Ref:* '+r,'*Date:* '+dt,'','*Client:* '+client.name,'*Business:* '+(client.business||'—'),'*Email:* '+client.email,'','*Service:*',s.title,'','*Fee:*',amountDue,'','*Payment*','Method: '+(PAYMENT_METHODS[method]?PAYMENT_METHODS[method].label:'—'),'Sender: '+senderName,'Contact: '+senderContact,'TxID: '+userRef].join('\n');

  const confirm=async()=>{
    setErrorMsg('');
    if(!method){setErrorMsg('Select a payment method.');return}
    if(!senderName.trim()){setErrorMsg('Enter the name on the payment.');return}
    if(!senderContact.trim()){setErrorMsg('Enter the phone or email used.');return}
    if(!userRef.trim()){setErrorMsg('Enter your transaction reference.');return}
    if(!agree){setErrorMsg('Tick the confirmation box.');return}
    setSaving(true);
    const rcpt=receiptPrefix+'-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*90000)+10000);
    const dt=new Date().toLocaleString('en-GB',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const record = {ref:rcpt,clientName:client.name,clientEmail:client.email,clientPhone:client.phone||'',clientBusiness:client.business||'',serviceCode:s.code||'DIR',serviceTitle:s.title,serviceFee:amountDue,amount:amountDue,method:PAYMENT_METHODS[method]?.label||method,senderName,senderContact,txRef:userRef,receiptDate:dt};
    const saved = await addPayment(record);
    setCloudSaved(saved ? 'ok' : 'fail');
    setReceiptNo(rcpt);
    setWhatsappUrl(waUrl(buildMsg(rcpt,dt)));
    setConfirmed(true);
    setSaving(false);
  };

  if(confirmed){
    return <div className="fadein">
      <div style={{background:'linear-gradient(135deg,#EAF7EE,#F0FBF4)',border:'2px solid #28A745',borderRadius:14,padding:'28px 24px',textAlign:'center'}}>
        <i className="fas fa-paper-plane" style={{fontSize:56,color:'#E8730F',marginBottom:12,display:'block'}}></i>
        <h4 className="serif" style={{fontSize:22,color:'#0A1F12',marginBottom:10}}>Payment reference submitted</h4>
        <p style={{fontSize:13.5,color:'rgba(10,31,18,.7)',marginBottom:14}}>Reference: <strong>{receiptNo}</strong></p>

        <div style={{display:'flex',flexDirection:'column',gap:10,marginTop:14}}>
          {m.rows.map((r,i)=>(
            <div key={i} style={{background:'#F7FAF8',border:'1px solid rgba(10,31,18,.1)',borderRadius:10,padding:'13px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:12}}>

            </div>

    {m&&<div style={{marginTop:20,paddingTop:20,borderTop:'1px dashed rgba(10,31,18,.15)'}}>

      <label style={{display:'flex',gap:12,alignItems:'flex-start',fontSize:13,color:'rgba(10,31,18,.85)',cursor:'pointer',lineHeight:1.55,marginTop:16}}><input type="checkbox" checked={agree} onChange={e=>setAgree(e.target.checked)} style={{width:18,height:18,accentColor:'#E8730F',flexShrink:0,marginTop:2,cursor:'pointer'}}/><span>I confirm I have sent <strong>{amountDue}</strong> to the account shown, and I understand an officer will verify it manually.</span></label>
      {errorMsg&&<div style={{background:'rgba(220,53,69,.08)',border:'1px solid rgba(220,53,69,.3)',borderRadius:8,padding:'10px 14px',marginTop:12,color:'#B8564F',fontSize:12.5,display:'flex',alignItems:'center',gap:8}}><i className="fas fa-exclamation-circle"></i> {errorMsg}</div>}
      <button type="button" onClick={confirm} disabled={saving} style={{width:'100%',marginTop:16,padding:'14px 20px',background:saving?'rgba(10,31,18,.15)':'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:14,fontWeight:700,cursor:saving?'wait':'pointer',fontFamily:'inherit',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:10}}><i className={`fas ${saving?'fa-spinner fa-spin':'fa-paper-plane'}`}></i>{saving?'Saving to server…':'Submit payment reference'}</button>
    </div>}

  </div>;
}

function CreateCampaignModal({onClose, onSave}) {

    name:'', package:'Sponsored', budget:'K455',
    startDate: today, endDate: plus30, goal:'', sponsorship: false

  const submit = async () => {
    if(!form.name.trim()) return toast('Enter a campaign name.', 'error');
    setSubmitting(true);
    await onSave(form);
    setSubmitting(false);
  };

  return <Modal open={true} onClose={onClose} eyebrow="New campaign" maxWidth="34rem">
    <h2 className="serif" style={{fontSize:24, marginBottom:6, color:'#0A1F12'}}>Create a Campaign</h2>
    <p style={{fontSize:13,color:'rgba(10,31,18,.6)',marginBottom:20}}>Promote your business. You'll see live impressions and clicks in your Overview.</p>
    <div className="form-grid" style={{gap:14}}>
      <div style={{gridColumn:'1/-1'}}>
        <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Campaign name *</label>

      </div>
      <div>
        <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Package *</label>
        <select value={form.package} onChange={e=>setForm({...form,package:e.target.value})} style={{...INP_STYLE, cursor:'pointer'}}>
          <option value="Featured">Featured Placement</option>
          <option value="Sponsored">Sponsored Placement</option>
        </select>
      </div>
      <div>
        <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Budget</label>
        <TIn value={form.budget} onChange={v=>setForm({...form,budget:v})}/>

      <div>
        <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Start date</label>
        <input type="date" value={form.startDate} onChange={e=>setForm({...form,startDate:e.target.value})} style={INP_STYLE}/>
      </div>
      <div>
        <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>End date</label>
        <input type="date" value={form.endDate} onChange={e=>setForm({...form,endDate:e.target.value})} style={INP_STYLE}/>

    <div style={{marginTop:14}}>
      <label style={{display:'flex', alignItems:'center', gap:8, fontSize:13, fontWeight:700}}>

    <div style={{display:'flex', gap:10, marginTop:22, flexWrap:'wrap'}}>
      <button onClick={submit} disabled={submitting} style={{flex:'1 1 180px', padding:'14px', background:submitting?'#ccc':'linear-gradient(135deg,#E8730F,#F5A623)', color:'#fff', border:'none', borderRadius:8, fontSize:14, fontWeight:700, cursor:submitting?'wait':'pointer'}}>{submitting?'Creating…':'Create Campaign'}</button>
      <button onClick={onClose} style={{padding:'14px 22px', background:'#fff', border:'1px solid rgba(10,31,18,.15)', borderRadius:8, fontSize:14, fontWeight:600, color:'#0A1F12'}}>Cancel</button>
    </div>
  </Modal>;

function Welcome({user,onDashboard,onBrowse,onSignedOut}){
  const [profile,setProfile]=useState(null);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    if(!user){setLoading(false);return;}
    loadUserProfile(user.uid).then(p=>{setProfile(p);setLoading(false);});
  },[user]);

  if(loading) return <div style={{minHeight:'100%',display:'flex',alignItems:'center',justifyContent:'center',background:'#F5FAF6'}}><i className="fas fa-spinner fa-spin" style={{fontSize:28,color:'#E8730F'}}></i></div>;

  const isSupplier=profile?.role==='supplier';
  const cat=profile&&CAT_MAP[profile.category]?CAT_MAP[profile.category]:{title:profile?.category||'General'};
  const isVerified=profile?.status==='verified';
  const firstName=(profile?.name||user.email||'').split(' ')[0];

  return <div className="fadein" style={{minHeight:'100%', background:'#F5FAF6', display:'flex', flexDirection:'column'}}>
    <main style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:'40px 24px'}}>
      <div style={{maxWidth:560,width:'100%'}}>
        <div style={{textAlign:'center',marginBottom:28}}>
          <div style={{width:76,height:76,borderRadius:'50%',background:'rgba(30,123,60,.12)',color:'#1E7B3C',display:'flex',alignItems:'center',justifyContent:'center',fontSize:34,margin:'0 auto 20px'}}><i className="fas fa-check"></i></div>
          <h1 className="serif" style={{fontSize:'clamp(1.7rem,4vw,2.3rem)',lineHeight:1.15,color:'#0A1F12',margin:'0 0 12px'}}>Welcome to StartEasy, {firstName}!</h1>
          <p style={{fontSize:14.5,lineHeight:1.7,color:'rgba(10,31,18,.65)',margin:'0 auto',maxWidth:420}}>Your {isSupplier?'supplier':'buyer'} account is ready.</p>
        </div>
        {profile && <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'18px 20px',marginBottom:20}}>
          <div style={{fontSize:10.5,textTransform:'uppercase',fontWeight:800,color:'rgba(10,31,18,.5)',marginBottom:10}}>Your account</div>
          <WelcomeRow k="Business" v={profile.businessName}/>
          <WelcomeRow k="Role" v={isSupplier?'Supplier':'Buyer'}/>
          <WelcomeRow k="Category" v={cat.title}/>
          <WelcomeRow k="Location" v={locLabel(profile)}/>
          <WelcomeRow k="Status" v={isVerified?'Verified':'Pending verification'}/>
        </div>}
        <div style={{marginBottom:20}}>
          <div style={{fontSize:10.5,textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:10}}>What would you like to do first?</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <button onClick={onBrowse} style={{padding:'16px 18px',background:'#fff',border:'1.5px solid rgba(10,31,18,.12)',borderRadius:10,textAlign:'left',cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:14,transition:'all .2s'}} onMouseEnter={e=>{e.currentTarget.style.borderColor='#1B6CA8';e.currentTarget.style.transform='translateY(-2px)';}} onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(10,31,18,.12)';e.currentTarget.style.transform='none';}}>
              <span style={{width:44,height:44,borderRadius:11,background:'rgba(27,108,168,.12)',color:'#1B6CA8',display:'flex',alignItems:'center',justifyContent:'center',fontSize:17,flexShrink:0}}><i className="fas fa-magnifying-glass"></i></span>
              <div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:800,color:'#0A1F12'}}>Browse {isSupplier?'buyers':'suppliers'} first</div><div style={{fontSize:12,color:'rgba(10,31,18,.6)',marginTop:2}}>See who's in your category right now</div></div>
              <i className="fas fa-arrow-right" style={{color:'rgba(10,31,18,.3)'}}></i>
            </button>
            <button onClick={onDashboard} style={{padding:'16px 18px',background:'linear-gradient(135deg,#E8730F,#F5A623)',border:'none',borderRadius:10,textAlign:'left',cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:14,color:'#fff',boxShadow:'0 12px 28px -10px rgba(232,115,15,.5)'}}>
              <span style={{width:44,height:44,borderRadius:11,background:'rgba(255,255,255,.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:17,flexShrink:0}}><i className="fas fa-house"></i></span>
              <div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:800}}>Open my dashboard</div><div style={{fontSize:12,color:'rgba(255,255,255,.85)',marginTop:2}}>Track matches, requests, and your profile</div></div>
              <i className="fas fa-arrow-right"></i>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>;
}
function WelcomeRow({k,v}){
  return <div style={{display:'flex',justifyContent:'space-between',gap:12,padding:'7px 0',borderBottom:'1px dashed rgba(10,31,18,.06)',fontSize:13}}>
    <span style={{color:'rgba(10,31,18,.55)',fontWeight:600}}>{k}</span>
    <span style={{color:'#0A1F12',fontWeight:700,textAlign:'right'}}>{v||'—'}</span>
  </div>;
}

function Browse({user,onRequestQuote,onRequestIntro,onDashboard,onSignedOut}){
  const [suppliers,setSuppliers]=useState([]);
  const [buyers,setBuyers]=useState([]);
  const [listings,setListings]=useState([]); 
  const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState('suppliers');
  const [query,setQuery]=useState('');
  const [category,setCategory]=useState('all');
  const [city,setCity]=useState('all');
  const [profile,setProfile]=useState(null);
  const [profileType,setProfileType]=useState(null);
  const [saved,setSaved]=useState(()=>user?getSavedSuppliers(user.uid):[]);

  useEffect(()=>{
    fsLoadDirectory().then(res=>{
      if(res && (res.suppliers.length||res.buyers.length)){
        setSuppliers(res.suppliers);
        setBuyers(res.buyers);
      }else{
        setSuppliers(SEED_SUPPLIERS);
        setBuyers(SEED_BUYERS);
      }
      setLoading(false);
    });
    
    // Load Listings for public view
    if (firebaseReady) {
      db.collection('se_listings').get().then(snap => {
        setListings(snap.docs.map(d => ({id: d.id, ...d.data()})));
      }).catch(e => console.warn(e));
    }
  },[]);

  const toggleSave=(supplierId)=>{
    if(!user){ toast('Sign in to save suppliers.', 'error'); return; }
    const next = saved.includes(supplierId) ? saved.filter(x=>x!==supplierId) : [...saved, supplierId];
    setSaved(next);
    saveSavedSuppliers(user.uid, next);
    toast(saved.includes(supplierId)?'Removed from saved.':'Saved to your dashboard.', 'success');
  };

  const filteredSuppliers=useMemo(()=>{
    const q=query.trim().toLowerCase();
    const results = suppliers.filter(s=>{
      if(category!=='all'&&s.category!==category) return false;
      if(city==='__intl'){ if(!isInternationalEntity(s)) return false; }
      else if(city!=='all'&&s.location!==city) return false;
      if(!q) return true;
      return (s.name+' '+s.location+' '+(s.country||'')+' '+(s.desc||'')+' '+(s.products||[]).join(' ')).toLowerCase().includes(q);
    });
    
    // Sort by featured first, then verified
    return results.sort((a, b) => {
      if (a.featured && !b.featured) return -1;
      if (!a.featured && b.featured) return 1;
      if (a.verified && !b.verified) return -1;
      if (!a.verified && b.verified) return 1;
      return 0;
    });
  },[suppliers,query,category,city]);

  const filteredBuyers=useMemo(()=>{
    const q=query.trim().toLowerCase();
    return buyers.filter(b=>{
      if(category!=='all'&&b.category!==category) return false;
      if(city==='__intl'){ if(!isInternationalEntity(b)) return false; }
      else if(city!=='all'&&b.location!==city) return false;
      if(!q) return true;
      return (b.name+' '+b.location+' '+(b.country||'')+' '+(b.desc||'')+' '+(b.sources||[]).join(' ')).toLowerCase().includes(q);
    });
  },[buyers,query,category,city]);

  const filteredListings=useMemo(()=>{
    const q=query.trim().toLowerCase();
    const results = listings.filter(l=>{
      if(category!=='all' && l.category!==category) return false;
      if(!q) return true;
      return (l.title + ' ' + l.description + ' ' + (l.moq||'')).toLowerCase().includes(q);
    });
    
    // Sort by Promoted first
    return results.sort((a,b) => (b.promoted ? 1:0) - (a.promoted ? 1:0));
  },[listings,query,category]);

  const list=tab==='suppliers'?filteredSuppliers:(tab==='buyers'?filteredBuyers:filteredListings);

  return <div className="fadein" style={{minHeight:'100%', background:'#F5FAF6', display:'flex', flexDirection:'column'}}>
    <main style={{flex:1,maxWidth:1240,margin:'0 auto',padding:'32px 24px 60px',width:'100%'}}>
      <div style={{marginBottom:24}}>
        <span className="micro" style={{color:'#E8730F',display:'block',marginBottom:12}}>Browse directory</span>
        <h1 className="serif" style={{fontSize:'clamp(1.8rem,4vw,2.5rem)',lineHeight:1.15,color:'#0A1F12',margin:'0 0 12px'}}>{list.length} {tab==='suppliers'?'supplier':tab==='buyers'?'buyer':'product'}{list.length===1?'':'s'}</h1>
      </div>
      <div style={{display:'flex',gap:6,marginBottom:16,background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:6}}>
        <button onClick={()=>{setTab('suppliers');setCategory('all');}} style={{flex:1,padding:'12px',background:tab==='suppliers'?'#0A1F12':'transparent',color:tab==='suppliers'?'#fff':'rgba(10,31,18,.7)',border:'none',borderRadius:8,fontSize:13.5,fontWeight:700}}>Suppliers ({suppliers.length})</button>
        <button onClick={()=>{setTab('buyers');setCategory('all');}} style={{flex:1,padding:'12px',background:tab==='buyers'?'#E8730F':'transparent',color:tab==='buyers'?'#fff':'rgba(10,31,18,.7)',border:'none',borderRadius:8,fontSize:13.5,fontWeight:700}}>Buyers ({buyers.length})</button>
        <button onClick={()=>{setTab('listings');setCategory('all');}} style={{flex:1,padding:'12px',background:tab==='listings'?'#1B6CA8':'transparent',color:tab==='listings'?'#fff':'rgba(10,31,18,.7)',border:'none',borderRadius:8,fontSize:13.5,fontWeight:700}}>Products ({listings.length})</button>
      </div>
      <div style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:12,padding:'16px 18px',marginBottom:16}}>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <div style={{position:'relative',flex:'1 1 260px',minWidth:0}}>
            <i className="fas fa-magnifying-glass" style={{position:'absolute',left:16,top:'50%',transform:'translateY(-50%)',color:'rgba(10,31,18,.4)',fontSize:13}}></i>
            <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search…" style={{...INP_STYLE,paddingLeft:40,fontSize:14}}/>
          </div>
          <select value={category} onChange={e=>setCategory(e.target.value)} style={{...INP_STYLE,minWidth:180,cursor:'pointer'}}>
            <option value="all">All categories</option>
            {CATEGORIES.map(c=><option key={c.key} value={c.key}>{c.title}</option>)}
          </select>
          {tab !== 'listings' && (
            <select value={city} onChange={e=>setCity(e.target.value)} style={{...INP_STYLE,minWidth:150,cursor:'pointer'}}>
              <option value="all">All locations</option>
              <option value="__intl">🌍 International</option>
              {ZAMBIAN_CITIES.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          )}
        </div>
      </div>
      {loading?<div style={{textAlign:'center',padding:'60px 0'}}><i className="fas fa-spinner fa-spin" style={{fontSize:24,color:'#E8730F'}}></i></div>:
      list.length===0?<div style={{background:'#fff',border:'1px dashed rgba(10,31,18,.15)',borderRadius:14,padding:'48px',textAlign:'center'}}><p style={{fontSize:13,color:'rgba(10,31,18,.55)',margin:0}}>No results.</p></div>:<div style={{display:'grid',gap:14,gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))'}}>
        {tab==='suppliers'?filteredSuppliers.map(s=>{
          const cat=CAT_MAP[s.category]||{color:'#E8730F',icon:'fa-building',title:'Supplier'};
          const isSaved=saved.includes(s.id);
          return <div key={s.id} style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:14,padding:'18px',display:'flex',flexDirection:'column',gap:10,borderTop:`3px solid ${cat.color}`}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{width:40,height:40,borderRadius:10,background:cat.color+'15',color:cat.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0, overflow:'hidden'}}>
                {s.profilePhoto ? <img src={s.profilePhoto} alt="Profile" style={{width:'100%', height:'100%', objectFit:'cover'}} /> : <i className={`fas ${cat.icon}`}></i>}
              </span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13.5,fontWeight:800,color:'#0A1F12', display:'flex', alignItems:'center'}}>
                  {s.name}
                  {s.verified && <VerifiedBadge size={14} />}
                  {s.featured && <span style={{background:'#E8730F', color:'#fff', fontSize:9, padding:'2px 4px', borderRadius:4, marginLeft:4, fontWeight:800}}>PRO</span>}
                </div>
                <div style={{fontSize:11,color:'rgba(10,31,18,.55)'}}><i className="fas fa-location-dot" style={{marginRight:4,fontSize:9}}></i>{locLabel(s)}</div>
              </div>
              <button onClick={()=>toggleSave(s.id)} style={{background:isSaved?'#E8730F':'#fff',border:'1px solid '+(isSaved?'#E8730F':'rgba(10,31,18,.15)'),color:isSaved?'#fff':'rgba(10,31,18,.4)',width:36,height:36,borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}} title={isSaved?'Saved':'Save'}>
                <i className={`fas fa-bookmark`} style={{fontSize:12}}></i>
              </button>
            </div>
            {isInternationalEntity(s)&&<span style={{alignSelf:'flex-start',display:'inline-flex',alignItems:'center',gap:5,padding:'3px 9px',borderRadius:99,background:'rgba(27,108,168,.1)',color:'#1B6CA8',fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'.04em'}}><i className="fas fa-globe" style={{fontSize:9}}></i> International</span>}
            <p style={{fontSize:12,color:'rgba(10,31,18,.65)',lineHeight:1.5,margin:0,flex:1}}>{s.desc}</p>
            <button onClick={()=>{setProfile(s);setProfileType('supplier');}} style={{padding:'9px',background:`linear-gradient(135deg,${cat.color},${cat.color}cc)`,color:'#fff',border:'none',borderRadius:8,fontSize:11.5,fontWeight:700}}>View profile</button>
          </div>;
        }):tab==='buyers'?filteredBuyers.map(b=>(
          <div key={b.id} style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:14,padding:'18px',display:'flex',flexDirection:'column',gap:10,borderTop:'3px solid #E8730F'}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{width:40,height:40,borderRadius:10,background:'rgba(232,115,15,.15)',color:'#E8730F',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0, overflow:'hidden'}}>
                {b.profilePhoto ? <img src={b.profilePhoto} alt="Profile" style={{width:'100%', height:'100%', objectFit:'cover'}} /> : <i className="fas fa-cart-shopping"></i>}
              </span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13.5,fontWeight:800,color:'#0A1F12', display:'flex', alignItems:'center'}}>
                  {b.name}
                  {b.verified && <VerifiedBadge size={14} />}
                </div>
                <div style={{fontSize:11,color:'rgba(10,31,18,.55)'}}><i className="fas fa-location-dot" style={{marginRight:4,fontSize:9}}></i>{locLabel(b)}</div>
              </div>
            </div>
            {isInternationalEntity(b)&&<span style={{alignSelf:'flex-start',display:'inline-flex',alignItems:'center',gap:5,padding:'3px 9px',borderRadius:99,background:'rgba(27,108,168,.1)',color:'#1B6CA8',fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'.04em'}}><i className="fas fa-globe" style={{fontSize:9}}></i> International</span>}
            <p style={{fontSize:12,color:'rgba(10,31,18,.65)',lineHeight:1.5,margin:0,flex:1}}>{b.desc}</p>
            <button onClick={()=>{setProfile(b);setProfileType('buyer');}} style={{padding:'9px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:11.5,fontWeight:700}}>View buyer</button>
          </div>
        )):filteredListings.map(l=>(
          <div key={l.id} style={{background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:14,padding:'18px',display:'flex',flexDirection:'column',gap:10,borderTop:'3px solid #1B6CA8'}}>
            {l.promoted && <span style={{alignSelf:'flex-start',display:'inline-flex',alignItems:'center',gap:5,padding:'3px 9px',borderRadius:99,background:'rgba(232,115,15,.1)',color:'#E8730F',fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:'.04em'}}><i className="fas fa-bolt" style={{fontSize:9}}></i> Promoted</span>}
            <div style={{fontSize:14,fontWeight:800,color:'#0A1F12'}}>{l.title}</div>

      </div>}
    </main>
    <Footer/>
    {profile&&profileType==='supplier'&&<SupplierProfileModal supplier={profile} user={user} listings={listings.filter(l => l.userId === profile.userId || l.userId === profile.id)} onClose={()=>setProfile(null)} onRequestQuote={(s)=>{setProfile(null);onRequestQuote(s);}}/>}
    {profile&&profileType==='buyer'&&<BuyerProfileModal buyer={profile} user={user} onClose={()=>setProfile(null)} onRequestIntro={(b)=>{setProfile(null);onRequestIntro(b);}}/>}

    if(!user) return false;
    return getSavedSuppliers(user.uid).includes(supplier.id);
  });

    if(!user){ toast('Sign in to save suppliers.', 'error'); return; }
    const cur = getSavedSuppliers(user.uid);
    const next = cur.includes(supplier.id) ? cur.filter(x=>x!==supplier.id) : [...cur, supplier.id];
    saveSavedSuppliers(user.uid, next);

  </Modal>;

      <div>{readOnly?<div className="sigval">{clientName||'[Client]'}</div>:<input className="siginput" value={clientName||''} onChange={()=>{}} placeholder="Type your full name to sign" readOnly style={{cursor:'default'}}/>}<div className="lbl">For the Client</div></div>

function Engagement({service,onClose,onAgreed}){
  const [client,setClient]=useState({name:'',business:'',email:'',phone:''});
  const [agreed,setAgreed]=useState(false);
  const [error,setError]=useState('');
  if(!service)return null;
  const s=service;
  const proceed=()=>{
    setError('');
    if(!client.name.trim()){setError('Please enter your full name.');return}
    if(!client.email.trim()){setError('Please enter your email.');return}
    if(!agreed){setError('Please confirm you agree to the engagement terms.');return}
    onAgreed({client,service:s});
  };
  return <Modal open={!!s} onClose={onClose} eyebrow="Engagement proposal" maxWidth="54rem">
    <EngagementLetterBody service={s} clientName={client.name} clientBusiness={client.business} clientEmail={client.email} readOnly={false}/>
    <div style={{marginTop:22,background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:10,padding:24}}>
      <div style={{fontSize:11,letterSpacing:'.14em',textTransform:'uppercase',fontWeight:800,color:'#8A6828',marginBottom:14}}>Client details</div>
      <div style={{display:'grid',gap:14,gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))'}}>
        <div><label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#0A1F12',marginBottom:6}}>Full name *</label><TIn value={client.name} onChange={v=>setClient({...client,name:v})} placeholder="Your full name"/></div>
        <div><label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#0A1F12',marginBottom:6}}>Business name</label><TIn value={client.business} onChange={v=>setClient({...client,business:v})} placeholder="If applicable"/></div>
        <div><label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#0A1F12',marginBottom:6}}>Email *</label><TIn type="email" value={client.email} onChange={v=>setClient({...client,email:v})} placeholder="you@company.com"/></div>
        <div><label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#0A1F12',marginBottom:6}}>Phone / WhatsApp</label><TIn value={client.phone} onChange={v=>setClient({...client,phone:v})} placeholder="+260 ..."/></div>
      </div>
      <label style={{display:'flex',gap:12,alignItems:'flex-start',fontSize:13,color:'rgba(10,31,18,.85)',cursor:'pointer',lineHeight:1.6,marginTop:18}}>
        <input type="checkbox" checked={agreed} onChange={e=>setAgreed(e.target.checked)} style={{width:18,height:18,accentColor:'#E8730F',flexShrink:0,marginTop:3,cursor:'pointer'}}/>
        <span>I have read and agree to the engagement proposal, scope, fees and terms above. I understand this is a StartEasy engagement and that StartEasy is not a government authority, regulator, law firm, auditor or tax adviser.</span>
      </label>
      {error&&<div style={{background:'rgba(220,53,69,.08)',border:'1px solid rgba(220,53,69,.3)',borderRadius:8,padding:'10px 14px',marginTop:14,color:'#B8564F',fontSize:12.5,display:'flex',alignItems:'center',gap:8}}><i className="fas fa-exclamation-circle"></i> {error}</div>}
      <div style={{display:'flex',flexWrap:'wrap',gap:12,marginTop:20}}>
        <button onClick={proceed} style={{flex:'1 1 240px',padding:'15px 24px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:8,fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:9}}><i className="fas fa-check-circle"></i> Agree and proceed to payment</button>
        <button onClick={onClose} style={{padding:'15px 24px',background:'#fff',border:'1px solid rgba(10,31,18,.15)',borderRadius:8,fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:'inherit',color:'#0A1F12'}}>Cancel</button>
      </div>
    </div>
  </Modal>;
}

function AuthModal({open,initialMode='signup',initialRole='buyer',onClose,onAuthSuccess}){
  const [mode,setMode]=useState(initialMode);
  const [role,setRole]=useState(initialRole);
  const [err,setErr]=useState('');
  const [submitting,setSubmitting]=useState(false);
  const [resetSent,setResetSent]=useState(false);
  const [resetEmail,setResetEmail]=useState('');
  const [signupSuccess,setSignupSuccess]=useState(false);
  const [form,setForm]=useState({name:'',businessName:'',email:'',phone:'',password:'',category:'',location:'',country:'Zambia',scope:'local',products:'',moq:'',delivery:'',leadTime:'',sources:'',frequency:'Monthly',orderValue:'',website:'',photos:''});
  
  const [profileFile, setProfileFile] = useState(null);
  const [coverFile, setCoverFile] = useState(null);

  useEffect(()=>{
    if(open){
      setMode(initialMode);
      setRole(initialRole);
      setErr('');
      setResetSent(false);
      setResetEmail('');
      setSignupSuccess(false);
      setProfileFile(null);
      setCoverFile(null);
    }
  },[open,initialMode,initialRole]);

  const submit=async()=>{
    setErr('');

    if(mode==='forgot'){
      const email=form.email.trim();
      if(!email) return setErr('Enter your email.');
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setErr('That email address is not valid.');
      if(!firebaseReady) return setErr('Auth service unavailable. Please try again.');
      setSubmitting(true);
      try{
        await auth.sendPasswordResetEmail(email);
        setResetEmail(email);
        setResetSent(true);
      }catch(e){
        const code=(e&&e.code)||'';
        if(code==='auth/user-not-found'){
          setResetEmail(email);
          setResetSent(true);
        }else{
          setErr(authErrorMessage(e));
        }
      }finally{setSubmitting(false);}
      return;
    }

    if(mode==='signin'){
      if(!form.email.trim()) return setErr('Enter your email.');
      if(!form.password) return setErr('Enter your password.');
      setSubmitting(true);
      try{
        await authSignIn(form.email.trim(),form.password);
        onAuthSuccess && onAuthSuccess('dashboard', false);
      }catch(e){
        setErr(authErrorMessage(e));
      }finally{setSubmitting(false);}
      return;
    }

    if(!form.name.trim()) return setErr('Enter your full name.');
    if(!form.businessName.trim()) return setErr('Enter your business name.');
    if(!form.email.trim()) return setErr('Enter your email.');
    if(!form.phone.trim()) return setErr('Enter your phone.');
    if(!form.category) return setErr('Choose a category.');
    if(!form.location||!form.location.trim()) return setErr('Enter your city / region.');
    if(form.password.length<6) return setErr('Password must be at least 6 characters.');
    if(role==='supplier' && !form.products.trim()) return setErr('List the products you supply.');
    if(role==='buyer' && !form.sources.trim()) return setErr('List what you buy regularly.');
    setSubmitting(true);
    try{
      const result = await authSignUp({...form,role, profileFile, coverFile});
      setSignupSuccess(true);
      setMode('signin');
      setForm(f=>({...f,email:result.email,password:''}));
      setRole(role);
    }catch(e){
      setErr(authErrorMessage(e));
    }finally{setSubmitting(false);}
  };

  if(mode==='forgot' && resetSent){
    return <Modal open={open} onClose={onClose} eyebrow="Reset link sent" maxWidth="40rem">
      <div style={{textAlign:'center',padding:'12px 0'}}>
        <div style={{width:64,height:64,borderRadius:'50%',background:'rgba(30,123,60,.12)',color:'#1E7B3C',display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,margin:'0 auto 16px'}}>
          <i className="fas fa-envelope-circle-check"></i>
        </div>
        <h2 className="serif" style={{fontSize:'clamp(1.4rem,3vw,1.75rem)',lineHeight:1.2,color:'#0A1F12',margin:'0 0 10px'}}>Check your email</h2>
        <p style={{fontSize:13.5,lineHeight:1.7,color:'rgba(10,31,18,.7)',margin:'0 auto 8px',maxWidth:380}}>
          If an account exists for <strong style={{color:'#0A1F12',wordBreak:'break-all'}}>{resetEmail}</strong>, we've sent a password reset link.
        </p>
        <p style={{fontSize:12,lineHeight:1.6,color:'rgba(10,31,18,.55)',margin:'0 auto 22px',maxWidth:380}}>
          Click the link in that email to set a new password. Check your spam folder if it doesn't arrive within a minute.
        </p>
        <button onClick={()=>{setMode('signin');setResetSent(false);setErr('');}} style={{width:'100%',padding:'14px',background:'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:700,marginBottom:10}}>
          Back to sign in
        </button>
        <button onClick={()=>{setResetSent(false);setErr('');}} style={{width:'100%',padding:'12px',background:'#fff',border:'1px solid rgba(10,31,18,.15)',borderRadius:10,fontSize:13,fontWeight:600,color:'#0A1F12'}}>
          Use a different email
        </button>
      </div>
    </Modal>;
  }

  if(mode==='forgot'){
    return <Modal open={open} onClose={onClose} eyebrow="Reset password" maxWidth="40rem">
      <h2 className="serif" style={{fontSize:'clamp(1.35rem,3vw,1.7rem)',lineHeight:1.2,color:'#0A1F12',margin:'0 0 8px'}}>Forgot your password?</h2>
      <p style={{fontSize:13.5,lineHeight:1.65,color:'rgba(10,31,18,.7)',margin:'0 0 20px'}}>
        Enter the email you signed up with. We'll send a secure link to reset your password.
      </p>
      <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Email</label>
      <TIn type="email" value={form.email} onChange={v=>setForm({...form,email:v})} placeholder="you@business.zm"/>
      {err && <div style={{background:'rgba(184,86,79,.08)',border:'1px solid rgba(184,86,79,.3)',borderRadius:8,padding:'10px 14px',marginTop:14,color:'#7C2318',fontSize:12.5}}>
        <i className="fas fa-circle-exclamation" style={{marginRight:6}}></i>{err}
      </div>}
      <button onClick={submit} disabled={submitting} style={{width:'100%',marginTop:18,padding:'14px',background:submitting?'rgba(10,31,18,.15)':'linear-gradient(135deg,#E8730F,#F5A623)',color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:700}}>
        {submitting?<><i className="fas fa-spinner fa-spin" style={{marginRight:8}}></i>Sending…</>:'Send reset link'}
      </button>
      <button onClick={()=>{setMode('signin');setErr('');}} style={{width:'100%',marginTop:10,padding:'12px',background:'transparent',border:'1px solid rgba(10,31,18,.15)',borderRadius:10,fontSize:13,fontWeight:600,color:'#0A1F12'}}>
        ← Back to sign in
      </button>
    </Modal>;
  }

  const eyebrowText = signupSuccess ? 'Sign in to continue' : (mode==='signin' ? 'Welcome back' : 'Create your account');

  return <Modal open={open} onClose={onClose} eyebrow={eyebrowText} maxWidth="40rem">
    {!signupSuccess && <div style={{display:'flex',gap:6,marginBottom:18,background:'#fff',border:'1px solid rgba(10,31,18,.08)',borderRadius:10,padding:5}}>
      <button onClick={()=>{setMode('signup');setErr('');}} style={{flex:1,padding:'10px',border:'none',borderRadius:8,fontSize:13,fontWeight:700,background:mode==='signup'?'#0A1F12':'transparent',color:mode==='signup'?'#fff':'rgba(10,31,18,.65)'}}>Create account</button>
      <button onClick={()=>{setMode('signin');setErr('');}} style={{flex:1,padding:'10px',border:'none',borderRadius:8,fontSize:13,fontWeight:700,background:mode==='signin'?'#0A1F12':'transparent',color:mode==='signin'?'#fff':'rgba(10,31,18,.65)'}}>Sign in</button>
    </div>}

    {signupSuccess && <div style={{background:'rgba(30,123,60,.06)',border:'1px solid rgba(30,123,60,.3)',borderRadius:10,padding:'14px 16px',marginBottom:16,display:'flex',gap:12,alignItems:'flex-start'}}>
      <i className="fas fa-circle-check" style={{color:'#1E7B3C',fontSize:18,marginTop:1,flexShrink:0}}></i>
      <div>
        <div style={{fontSize:13.5,fontWeight:800,color:'#0F5C2A',marginBottom:4}}>Account created successfully</div>
        <div style={{fontSize:12.5,lineHeight:1.55,color:'rgba(10,31,18,.75)'}}>For security, sign in with your email and password to continue to your dashboard.</div>
      </div>
    </div>}

    {mode==='signup'&&<>
      <div style={{marginBottom:16}}>
        <label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:8}}>I am registering as a…</label>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <button onClick={()=>setRole('buyer')} style={{padding:'14px 12px',border:role==='buyer'?'2px solid #E8730F':'2px solid rgba(10,31,18,.1)',background:role==='buyer'?'rgba(232,115,15,.06)':'#fff',borderRadius:10,textAlign:'left',cursor:'pointer'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}><i className="fas fa-cart-shopping" style={{color:'#E8730F',fontSize:14}}></i><span style={{fontSize:13,fontWeight:800,color:'#0A1F12'}}>Buyer</span></div>
            <div style={{fontSize:11,color:'rgba(10,31,18,.6)',lineHeight:1.4}}>I source products</div>
          </button>
          <button onClick={()=>setRole('supplier')} style={{padding:'14px 12px',border:role==='supplier'?'2px solid #1B6CA8':'2px solid rgba(10,31,18,.1)',background:role==='supplier'?'rgba(27,108,168,.06)':'#fff',borderRadius:10,textAlign:'left',cursor:'pointer'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}><i className="fas fa-truck-fast" style={{color:'#1B6CA8',fontSize:14}}></i><span style={{fontSize:13,fontWeight:800,color:'#0A1F12'}}>Supplier</span></div>
            <div style={{fontSize:11,color:'rgba(10,31,18,.6)',lineHeight:1.4}}>I sell products</div>
          </button>
        </div>
      </div>
      <div style={{display:'grid',gap:14,gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',marginBottom:14}}>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Full name *</label><TIn value={form.name} onChange={v=>setForm({...form,name:v})}/></div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Business name *</label><TIn value={form.businessName} onChange={v=>setForm({...form,businessName:v})}/></div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Email *</label><TIn type="email" value={form.email} onChange={v=>setForm({...form,email:v})}/></div>
        <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Phone *</label><TIn value={form.phone} onChange={v=>setForm({...form,phone:v})} placeholder="+260 …"/></div>

          <div><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Lead time</label><TIn value={form.leadTime} onChange={v=>setForm({...form,leadTime:v})} placeholder="e.g. 3–5 days"/></div>
          <div style={{gridColumn:'1/-1'}}><label style={{display:'block',fontSize:11.5,fontWeight:700,color:'#0A1F12',marginBottom:6}}>Delivery coverage</label><TIn value={form.delivery} onChange={v=>setForm({...form,delivery:v})}/></div>
